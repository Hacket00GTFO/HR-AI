services:
    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.20.1
        container_name: postgres-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
        deploy:
            resources:
                limits:
                    memory: 128M
