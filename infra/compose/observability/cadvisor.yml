services:
    cadvisor:
        image: ghcr.io/google/cadvisor:0.54.0
        container_name: cadvisor
        restart: unless-stopped
        privileged: true
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            - /dev/disk:/dev/disk:ro
        command:
            - --docker_only=true
            - --housekeeping_interval=10s
            - --store_container_labels=false
            - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
            - --disable_metrics=advtcp,cpu_topology,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp
        deploy:
            resources:
                limits:
                    memory: 768M
