# Tempo — distributed tracing backend. Receives OTLP, stores locally.
services:
    tempo:
        image: grafana/tempo:2.9.4
        container_name: tempo
        restart: unless-stopped
        ports:
            - '3200:3200'
            - '4317:4317'
            - '4318:4318'
        command:
            - -config.file=/etc/tempo/tempo.yml
        volumes:
            - ../../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
            - tempo-data:/var/tempo
        deploy:
            resources:
                limits:
                    memory: 512M
