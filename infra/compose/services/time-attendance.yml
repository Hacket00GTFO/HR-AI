# time-attendance — work schedules, consent-gated geo check-ins, leave (port 3011).
# Merge into root docker-compose.yml during integration — see README.md.
services:
    time-attendance:
        build:
            context: ../../.. # repo root
            dockerfile: apps/time-attendance/Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3011
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/strafor_time
            SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
            RABBITMQ_URL: ${RABBITMQ_URL}
            RABBITMQ_EXCHANGE: domain.events
            # Observability
            SERVICE_NAME: time-attendance
            METRICS_TOKEN: ${METRICS_TOKEN}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
            OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
            OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3011/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
        labels:
            prometheus.scrape: 'true'
            prometheus.port: '3011'
            prometheus.path: '/metrics'
        ports:
            - '3011:3011'
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 256M
