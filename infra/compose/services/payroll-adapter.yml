# payroll-adapter — adapter-first MX payroll: provider import, period
# lifecycle, shadow-mode reconciliation (port 3012, db strafor_payroll).
# Merge into root docker-compose.yml during integration — see README.md.
#
# Gateway routing (wired separately): /api/v1/payroll/* → payroll-adapter:3012.
# HR/Finance only — platform admins are always 403 on this service.
services:
    payroll-adapter:
        build:
            context: ../../.. # repo root
            dockerfile: apps/payroll-adapter/Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3012
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/strafor_payroll
            SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
            RABBITMQ_URL: ${RABBITMQ_URL}
            RABBITMQ_EXCHANGE: domain.events
            # file_generic adapter drop dir + generated export files.
            IMPORTS_DIR: /app/payroll_imports
            EXPORTS_DIR: /app/payroll_exports
            # Observability
            SERVICE_NAME: payroll-adapter
            METRICS_TOKEN: ${METRICS_TOKEN}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
            OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
            OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3012/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
        labels:
            prometheus.scrape: 'true'
            prometheus.port: '3012'
            prometheus.path: '/metrics'
        ports:
            - '3012:3012'
        volumes:
            - payroll-imports:/app/payroll_imports
            - payroll-exports:/app/payroll_exports
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 256M

volumes:
    payroll-imports:
    payroll-exports:
