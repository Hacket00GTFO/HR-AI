# recruitment-core — vacancies + candidates + applications extracted from the
# monolith (port 3009, DB strafor_recruitment). See docs/extraction/recruitment-core.md.
services:
    recruitment-core:
        build:
            context: ../../.. # repo root
            dockerfile: apps/recruitment-core/Dockerfile
        environment:
            NODE_ENV: production
            PORT: 3009
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/strafor_recruitment
            # Downstream services (in-cluster defaults; leave empty to degrade
            # gracefully — AI endpoints 503, resume upload/download 503).
            AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-matching:3005}
            DOCUMENTS_URL: ${DOCUMENTS_URL:-http://documents-resumes:3004}
            # Shared secret for service-to-service calls (X-Service-Token).
            SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
            # Optional legacy resume fallback for rows migrated with the old
            # `resume` filename column (pre-extraction local storage).
            RESUMES_DIR: ${RESUMES_DIR:-}
            RABBITMQ_URL: ${RABBITMQ_URL}
            RABBITMQ_EXCHANGE: domain.events
            # Observability
            SERVICE_NAME: recruitment-core
            METRICS_TOKEN: ${METRICS_TOKEN}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
            OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
            OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3009/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
        labels:
            prometheus.scrape: 'true'
            prometheus.port: '3009'
            prometheus.path: '/metrics'
        ports:
            - '3009:3009'
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 384M
