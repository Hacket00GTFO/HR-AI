# Fragment for the unified Next.js frontend — merged into the root compose
# file during integration (see infra/compose/services/README.md).
# Port map: web = 3010. The app is a pure frontend+BFF — no database.
services:
    web:
        build:
            context: ../../.. # repo root
            dockerfile: apps/web/Dockerfile
        environment:
            PORT: '3010'
            NODE_ENV: production
            # Backend selection: legacy monolith today, gateway once it lands.
            API_URL: ${API_URL:-http://api:3000}
            GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
            AUTH_MODE: ${AUTH_MODE:-legacy}
            # Cookies: set to true only behind HTTPS. HTTP localhost needs false.
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            # Observability
            SERVICE_NAME: web
            METRICS_TOKEN: ${METRICS_TOKEN}
            GRAFANA_INTERNAL_URL: ${GRAFANA_INTERNAL_URL:-http://grafana:3000/api/grafana}
            GRAFANA_PUBLIC_PATH: ${GRAFANA_PUBLIC_PATH:-/api/grafana}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
            OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
            OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost:3010/api/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 6
        labels:
            prometheus.scrape: 'true'
            prometheus.port: '3010'
            prometheus.path: '/api/metrics'
        ports:
            - '3010:3010'
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 512M
