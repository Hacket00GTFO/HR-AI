# Dev override: publishes observability ports for direct access.
# Usage: docker compose -f docker-compose.yml -f infra/compose/docker-compose.observability-dev.yml up
services:
    prometheus:
        ports:
            - '9090:9090'
    alertmanager:
        ports:
            - '9093:9093'
        volumes:
            - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
            - ./infra/observability/alertmanager/templates:/etc/alertmanager/templates:ro
            - alertmanager-data:/alertmanager
    grafana:
        ports:
            - '3300:3000'
    loki:
        ports:
            - '3100:3100'
    tempo:
        ports:
            - '3200:3200'
            - '4317:4317'
            - '4318:4318'
    cadvisor:
        ports:
            - '8085:8080'
    node-exporter:
        ports:
            - '9100:9100'
    postgres-exporter:
        ports:
            - '9187:9187'
    redis-exporter:
        ports:
            - '9121:9121'
    blackbox-exporter:
        ports:
            - '9115:9115'
    celery-exporter:
        ports:
            - '9808:9808'
    promtail:
        ports:
            - '9080:9080'
