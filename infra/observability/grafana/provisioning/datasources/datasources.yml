apiVersion: 1

datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          exemplarTraceIdDestinations:
              - name: traceID
                datasourceUid: tempo
                url: '$${__value.raw}'
          timeInterval: '15s'

    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      jsonData:
          derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"(\w+)"'
                url: '$${__value.raw}'
                datasourceUid: tempo
          maxLines: 1000

    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      editable: false
      jsonData:
          tracesToLogsV2:
              datasourceUid: loki
              tags: ['service', 'http.method', 'http.route']
              spanStartTimeShift: '-5m'
              spanEndTimeShift: '5m'
              filterByTraceID: false
              filterBySpanID: false
              customQuery: true
              query: '{service="$${__span.tags.service}"} | json | trace_id="$${__trace.traceId}"'
          tracesToMetrics:
              datasourceUid: prometheus
              queries:
                  - name: 'Throughput'
                    query: 'sum(rate(http_requests_total{service="$${__span.tags.service}"}[5m]))'
                  - name: 'Error rate'
                    query: 'sum(rate(http_requests_total{service="$${__span.tags.service}",status_class="5xx"}[5m]))'
          serviceMap:
              datasourceUid: prometheus
          nodeGraph:
              enabled: true
          search:
              hide: false

    - name: Alertmanager
      uid: alertmanager
      type: alertmanager
      access: proxy
      url: http://alertmanager:9093
      editable: false
      jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
