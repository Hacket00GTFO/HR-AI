apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: node-exporter
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: node-exporter
    template:
        metadata:
            labels:
                app.kubernetes.io/name: node-exporter
        spec:
            hostNetwork: true
            hostPID: true
            containers:
                - name: node-exporter
                  image: prom/node-exporter:v1.12.1
                  args:
                      - --path.rootfs=/host
                      - --collector.disable_default_collectors
                      - --collector.cpu
                      - --collector.diskstats
                      - --collector.filesystem
                      - --collector.loadavg
                      - --collector.meminfo
                      - --collector.netdev
                      - --collector.stat
                      - --collector.time
                      - --collector.uname
                      - --collector.vmstat
                  ports:
                      - containerPort: 9100
                  volumeMounts:
                      - name: rootfs
                        mountPath: /host
                        readOnly: true
                  resources:
                      requests:
                          memory: 32Mi
                      limits:
                          memory: 64Mi
            volumes:
                - name: rootfs
                  hostPath:
                      path: /
