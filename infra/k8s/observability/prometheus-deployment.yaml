apiVersion: apps/v1
kind: Deployment
metadata:
    name: prometheus
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: prometheus
    template:
        metadata:
            labels:
                app.kubernetes.io/name: prometheus
        spec:
            serviceAccountName: prometheus
            containers:
                - name: prometheus
                  image: prom/prometheus:v3.13.2
                  args:
                      - --config.file=/etc/prometheus/prometheus.yml
                      - --storage.tsdb.path=/prometheus
                      - --storage.tsdb.retention.time=90d
                      - --storage.tsdb.retention.size=20GB
                      - --web.enable-remote-write-receiver
                      - --enable-feature=exemplar-storage
                  ports:
                      - containerPort: 9090
                  volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                      - name: rules
                        mountPath: /etc/prometheus/rules
                      - name: data
                        mountPath: /prometheus
                  resources:
                      requests:
                          memory: 512Mi
                          cpu: 250m
                      limits:
                          memory: 1Gi
            volumes:
                - name: config
                  configMap:
                      name: prometheus-config
                - name: rules
                  configMap:
                      name: prometheus-alert-rules
                - name: data
                  persistentVolumeClaim:
                      claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: prometheus-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 25Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: prometheus
rules:
    - apiGroups: ['']
      resources: ['nodes', 'nodes/proxy', 'pods', 'services', 'endpoints']
      verbs: ['get', 'list', 'watch']
    - apiGroups: ['']
      resources: ['configmaps', 'secrets']
      verbs: ['get']
    - nonResourceURLs: ['/metrics', '/api/v1/nodes/*/proxy/metrics', '/api/v1/nodes/*/proxy/metrics/cadvisor']
      verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: prometheus
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: prometheus
subjects:
    - kind: ServiceAccount
      name: prometheus
      namespace: strafor-observability
