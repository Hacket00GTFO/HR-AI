apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: strafor-observability

resources:
    - namespace.yaml
    - prometheus-configmap.yaml
    - prometheus-alert-rules-configmap.yaml
    - prometheus-deployment.yaml
    - prometheus-service.yaml
    - grafana-configmap.yaml
    - grafana-dashboards-configmap.yaml
    - grafana-deployment.yaml
    - grafana-service.yaml
    - loki-configmap.yaml
    - loki-statefulset.yaml
    - loki-service.yaml
    - tempo-configmap.yaml
    - tempo-statefulset.yaml
    - tempo-service.yaml
    - alertmanager-configmap.yaml
    - alertmanager-deployment.yaml
    - alertmanager-service.yaml
    - promtail-configmap.yaml
    - promtail-daemonset.yaml
    - promtail-service.yaml
    - node-exporter-daemonset.yaml
    - node-exporter-service.yaml

configMapGenerator:
    - name: grafana-dashboards
      files:
          - ../../observability/grafana/dashboards/containers-overview.json
          - ../../observability/grafana/dashboards/container-detail.json
          - ../../observability/grafana/dashboards/services-red.json
          - ../../observability/grafana/dashboards/platform-datastores.json
          - ../../observability/grafana/dashboards/ai-matching.json
          - ../../observability/grafana/dashboards/logs-explorer.json
          - ../../observability/grafana/dashboards/traces.json
          - ../../observability/grafana/dashboards/alerts-overview.json

commonLabels:
    app.kubernetes.io/part-of: strafor
    app.kubernetes.io/component: observability
