apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
data:
    prometheus.yml: |
        global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
                cluster: strafor-k8s
        rule_files:
            - /etc/prometheus/rules/*.yml
        alerting:
            alertmanagers:
                - static_configs:
                  - targets: ['alertmanager:9093']
        scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                  - targets: ['localhost:9090']
            # Kubernetes pod discovery — scrapes pods with annotation
            # prometheus.io/scrape=true, prometheus.io/port, prometheus.io/path
            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                  - role: pod
              relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    regex: 'true'
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    regex: '(.+)'
                    target_label: __metrics_path__
                    replacement: '${1}'
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    regex: '([^:]+)(?::\d+)?;(\d+)'
                    target_label: __address__
                    replacement: '${1}:${2}'
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    target_label: service
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
              metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: 'go_.*|process_.*'
                    action: labeldrop
            # kubelet cAdvisor
            - job_name: 'kubernetes-cadvisor'
              kubernetes_sd_configs:
                  - role: node
              scheme: https
              tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: '(.+)'
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
              metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: 'container_blkio_time_seconds_total|container_cpu_cfs_throttled_seconds_total'
                    action: drop
            # node-exporter
            - job_name: 'node-exporter'
              kubernetes_sd_configs:
                  - role: pod
              relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    regex: 'node-exporter'
                    action: keep
                  - target_label: service
                    replacement: node-exporter
            # Grafana self-monitoring
            - job_name: 'grafana'
              static_configs:
                  - targets: ['grafana:3000']
              metrics_path: /metrics
            # Loki self-monitoring
            - job_name: 'loki'
              static_configs:
                  - targets: ['loki:3100']
              metrics_path: /metrics
            # Tempo self-monitoring
            - job_name: 'tempo'
              static_configs:
                  - targets: ['tempo:3200']
              metrics_path: /metrics
            # Alertmanager self-monitoring
            - job_name: 'alertmanager'
              static_configs:
                  - targets: ['alertmanager:9093']
