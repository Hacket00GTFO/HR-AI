apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: loki
spec:
    serviceName: loki
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: loki
    template:
        metadata:
            labels:
                app.kubernetes.io/name: loki
        spec:
            containers:
                - name: loki
                  image: grafana/loki:3.6.16
                  args: ['-config.file=/etc/loki/loki-config.yml']
                  ports:
                      - containerPort: 3100
                  volumeMounts:
                      - name: config
                        mountPath: /etc/loki
                      - name: data
                        mountPath: /loki
                  resources:
                      requests:
                          memory: 256Mi
                      limits:
                          memory: 512Mi
            volumes:
                - name: config
                  configMap:
                      name: loki-config
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 10Gi
