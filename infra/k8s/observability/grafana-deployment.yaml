apiVersion: apps/v1
kind: Deployment
metadata:
    name: grafana
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: grafana
    template:
        metadata:
            labels:
                app.kubernetes.io/name: grafana
        spec:
            containers:
                - name: grafana
                  image: grafana/grafana:13.0.8
                  env:
                      - name: GF_SECURITY_ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: grafana-secrets
                                key: admin-password
                                optional: true
                  ports:
                      - containerPort: 3000
                  volumeMounts:
                      - name: config
                        mountPath: /etc/grafana/provisioning/datasources/datasources.yml
                        subPath: datasources.yml
                      - name: config
                        mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
                        subPath: dashboards.yml
                      - name: config
                        mountPath: /etc/grafana/grafana.ini
                        subPath: grafana.ini
                      - name: dashboards
                        mountPath: /var/lib/grafana/dashboards
                      - name: data
                        mountPath: /var/lib/grafana
                  resources:
                      requests:
                          memory: 128Mi
                      limits:
                          memory: 256Mi
            volumes:
                - name: config
                  configMap:
                      name: grafana-config
                - name: dashboards
                  configMap:
                      name: grafana-dashboards
                - name: data
                  persistentVolumeClaim:
                      claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: grafana-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
