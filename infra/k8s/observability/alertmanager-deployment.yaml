apiVersion: apps/v1
kind: Deployment
metadata:
    name: alertmanager
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: alertmanager
    template:
        metadata:
            labels:
                app.kubernetes.io/name: alertmanager
        spec:
            containers:
                - name: alertmanager
                  image: prom/alertmanager:v0.34.0
                  args:
                      - --config.file=/etc/alertmanager/alertmanager.yml
                      - --storage.path=/alertmanager
                  ports:
                      - containerPort: 9093
                  volumeMounts:
                      - name: config
                        mountPath: /etc/alertmanager
                      - name: data
                        mountPath: /alertmanager
                  resources:
                      requests:
                          memory: 64Mi
                      limits:
                          memory: 128Mi
            volumes:
                - name: config
                  configMap:
                      name: alertmanager-config
                - name: data
                  persistentVolumeClaim:
                      claimName: alertmanager-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: alertmanager-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
