apiVersion: v1
kind: ConfigMap
metadata:
    name: promtail-config
data:
    promtail-config.yml: |
        server:
            http_listen_port: 9080
        positions:
            filename: /tmp/positions.yaml
        clients:
            - url: http://loki:3100/loki/api/v1/push
        scrape_configs:
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                  - role: pod
              relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace]
                    regex: 'strafor'
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    target_label: service
              pipeline_stages:
                  - json:
                    expressions:
                        level: level
                        msg: msg
                        trace_id: trace_id
                        span_id: span_id
                        timestamp: time
                  - labels:
                    level:
                  - timestamp:
                    source: timestamp
                    format: RFC3339Nano
                    fallback_formats:
                        - ISO8601
                  - output:
                    source: msg
