apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: promtail
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: promtail
    template:
        metadata:
            labels:
                app.kubernetes.io/name: promtail
        spec:
            containers:
                - name: promtail
                  image: grafana/promtail:3.6.11
                  args: ['-config.file=/etc/promtail/promtail-config.yml']
                  env:
                      - name: LOKI_URL
                        value: http://loki:3100
                  volumeMounts:
                      - name: config
                        mountPath: /etc/promtail
                      - name: varlog
                        mountPath: /var/log
                        readOnly: true
                      - name: varlibdockercontainers
                        mountPath: /var/lib/docker/containers
                        readOnly: true
                  resources:
                      requests:
                          memory: 64Mi
                      limits:
                          memory: 128Mi
            volumes:
                - name: config
                  configMap:
                      name: promtail-config
                - name: varlog
                  hostPath:
                      path: /var/log
                - name: varlibdockercontainers
                  hostPath:
                      path: /var/lib/docker/containers
