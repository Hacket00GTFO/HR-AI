apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: tempo
spec:
    serviceName: tempo
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: tempo
    template:
        metadata:
            labels:
                app.kubernetes.io/name: tempo
        spec:
            containers:
                - name: tempo
                  image: grafana/tempo:2.9.4
                  args: ['-config.file=/etc/tempo/tempo.yml']
                  ports:
                      - containerPort: 3200
                      - containerPort: 4317
                      - containerPort: 4318
                  volumeMounts:
                      - name: config
                        mountPath: /etc/tempo
                      - name: data
                        mountPath: /var/tempo
                  resources:
                      requests:
                          memory: 256Mi
                      limits:
                          memory: 512Mi
            volumes:
                - name: config
                  configMap:
                      name: tempo-config
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 10Gi
