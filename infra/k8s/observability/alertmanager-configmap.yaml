apiVersion: v1
kind: ConfigMap
metadata:
    name: alertmanager-config
data:
    alertmanager.yml: |
        global:
            resolve_timeout: 5m
        route:
            group_by: ['alertname', 'service']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: 'default'
            routes:
                - matchers: ['severity="critical"']
                  receiver: 'all'
                  group_wait: 10s
                  repeat_interval: 1h
                - matchers: ['severity="warning"']
                  receiver: 'all'
                  repeat_interval: 4h
                - matchers: ['severity="info"']
                  receiver: 'strafor-admin'
        receivers:
            - name: 'default'
              webhook_configs:
                  - url: 'http://api.strafor.svc.cluster.local:3000/api/admin/alerts/webhook'
                    send_resolved: true
            - name: 'all'
              webhook_configs:
                  - url: 'http://api.strafor.svc.cluster.local:3000/api/admin/alerts/webhook'
                    send_resolved: true
            - name: 'strafor-admin'
              webhook_configs:
                  - url: 'http://api.strafor.svc.cluster.local:3000/api/admin/alerts/webhook'
                    send_resolved: true
        inhibit_rules:
            - source_matchers: ['alertname="ContainerDown"']
              target_matchers: ['alertname=~"ContainerHigh.*"']
              equal: ['service']
