# Pod hardening for the stateless app services (strategic-merge patches).
#
# Every pod gets:
#   - serviceAccountName: strafor-workload + label azure.workload.identity/use
#     (Workload Identity webhook injects the federated token the CSI
#     provider uses to reach Key Vault)
#   - runAsNonRoot + explicit numeric runAsUser/runAsGroup/fsGroup
#     (image USERs are non-numeric — `node`, `app` — so runAsNonRoot alone
#     would be rejected by the kubelet)
#   - seccompProfile RuntimeDefault
#   - container: allowPrivilegeEscalation=false, capabilities drop ALL,
#     readOnlyRootFilesystem=true
#   - emptyDir /tmp (Node/Python write temp files; root fs is read-only)
#   - a secrets-store.csi.k8s.io volume mounting strafor-keyvault, which
#     also triggers the sync of the `strafor-secrets` Secret used by
#     envFrom (see secretproviderclass.yaml)
#   - a CPU limit (base only set memory limits)
#
# node images run as uid/gid 1000; ai-matching's `app` user is a debian
# system user -> uid/gid 999 (verify with `docker run --rm <img> id app`
# if the Dockerfile base image changes).
apiVersion: apps/v1
kind: Deployment
metadata:
    namespace: strafor
    name: api
spec:
    template:
        metadata:
            labels:
                azure.workload.identity/use: 'true'
        spec:
            serviceAccountName: strafor-workload
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile: { type: RuntimeDefault }
            containers:
                - name: api
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: ['ALL'] }
                  resources:
                      limits:
                          cpu: '1'
                  volumeMounts:
                      - { name: tmp, mountPath: /tmp }
                      # compose maps exports-data here; base was missing it.
                      - { name: exports, mountPath: /app/secure_uploads/exports }
                      - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
            volumes:
                - { name: tmp, emptyDir: {} }
                - name: exports
                  persistentVolumeClaim: { claimName: strafor-exports }
                - name: secrets-store
                  csi:
                      driver: secrets-store.csi.k8s.io
                      readOnly: true
                      volumeAttributes:
                          secretProviderClass: strafor-keyvault
---
