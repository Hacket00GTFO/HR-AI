# Azure Key Vault integration via the Secrets Store CSI driver (AKS-native).
#
# Auth: Azure AD Workload Identity. The ServiceAccount below carries the
# client ID of a user-assigned managed identity (or app registration) that
# has `Key Vault Secrets User` on the vault; the pod template label
# `azure.workload.identity/use: "true"` (added by the hardening patches)
# makes the WI mutating webhook inject the federated token.
#
# Replace the three placeholders before applying:
#   <AKV_NAME>          e.g. strafor-prod-kv
#   <AZURE_TENANT_ID>   e.g. 00000000-0000-0000-0000-000000000000
#   <WI_CLIENT_ID>      client ID of the workload managed identity
#
# Key Vault object names cannot contain '_' — objects use kebab-case in the
# vault and objectAlias maps them onto the env keys the app expects. The
# synced `strafor-secrets` Secret keeps the base `envFrom: secretRef`
# wiring unchanged; DATABASE_URL/RABBITMQ_URL are still composed from
# $(POSTGRES_PASSWORD)/$(RABBITMQ_PASSWORD) at container start.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: strafor-workload
    labels:
        app.kubernetes.io/part-of: strafor
    annotations:
        azure.workload.identity/client-id: <WI_CLIENT_ID>
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
    name: strafor-keyvault
    labels:
        app.kubernetes.io/part-of: strafor
spec:
    provider: azure
    parameters:
        usePodIdentity: 'false'
        useVMManagedIdentity: 'false'
        # Workload identity: client ID of the user-assigned managed
        # identity (same value as the ServiceAccount annotation).
        clientID: <WI_CLIENT_ID>
        keyvaultName: <AKV_NAME>
        tenantId: <AZURE_TENANT_ID>
        objects: |
            array:
              - |
                objectName: postgres-password
                objectType: secret
                objectAlias: POSTGRES_PASSWORD
              - |
                objectName: rabbitmq-password
                objectType: secret
                objectAlias: RABBITMQ_PASSWORD
              - |
                objectName: minio-root-user
                objectType: secret
                objectAlias: MINIO_ROOT_USER
              - |
                objectName: minio-root-password
                objectType: secret
                objectAlias: MINIO_ROOT_PASSWORD
              - |
                objectName: jwt-secret
                objectType: secret
                objectAlias: JWT_SECRET
              - |
                objectName: jwt-private-key
                objectType: secret
                objectAlias: JWT_PRIVATE_KEY
              - |
                objectName: jwt-public-key
                objectType: secret
                objectAlias: JWT_PUBLIC_KEY
              - |
                objectName: settings-encryption-key
                objectType: secret
                objectAlias: SETTINGS_ENCRYPTION_KEY
              - |
                objectName: service-auth-token
                objectType: secret
                objectAlias: SERVICE_AUTH_TOKEN
              - |
                objectName: smtp-user
                objectType: secret
                objectAlias: SMTP_USER
              - |
                objectName: smtp-pass
                objectType: secret
                objectAlias: SMTP_PASS
              - |
                objectName: openai-api-key
                objectType: secret
                objectAlias: OPENAI_API_KEY
              - |
                objectName: anthropic-api-key
                objectType: secret
                objectAlias: ANTHROPIC_API_KEY
              - |
                objectName: metrics-token
                objectType: secret
                objectAlias: METRICS_TOKEN
              - |
                objectName: alert-webhook-token
                objectType: secret
                objectAlias: ALERT_WEBHOOK_TOKEN
    # Mirror every object into a real Secret so `envFrom: secretRef:
    # strafor-secrets` (base manifests) keeps working. The Secret is
    # created/updated when a pod mounts this SecretProviderClass.
    secretObjects:
        - secretName: strafor-secrets
          type: Opaque
          data:
              - { objectName: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
              - { objectName: RABBITMQ_PASSWORD, key: RABBITMQ_PASSWORD }
              - { objectName: MINIO_ROOT_USER, key: MINIO_ROOT_USER }
              - { objectName: MINIO_ROOT_PASSWORD, key: MINIO_ROOT_PASSWORD }
              - { objectName: JWT_SECRET, key: JWT_SECRET }
              - { objectName: JWT_PRIVATE_KEY, key: JWT_PRIVATE_KEY }
              - { objectName: JWT_PUBLIC_KEY, key: JWT_PUBLIC_KEY }
              - { objectName: SETTINGS_ENCRYPTION_KEY, key: SETTINGS_ENCRYPTION_KEY }
              - { objectName: SERVICE_AUTH_TOKEN, key: SERVICE_AUTH_TOKEN }
              - { objectName: SMTP_USER, key: SMTP_USER }
              - { objectName: SMTP_PASS, key: SMTP_PASS }
              - { objectName: OPENAI_API_KEY, key: OPENAI_API_KEY }
              - { objectName: ANTHROPIC_API_KEY, key: ANTHROPIC_API_KEY }
              - { objectName: METRICS_TOKEN, key: METRICS_TOKEN }
              - { objectName: ALERT_WEBHOOK_TOKEN, key: ALERT_WEBHOOK_TOKEN }
