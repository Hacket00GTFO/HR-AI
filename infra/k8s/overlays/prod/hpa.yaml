# HorizontalPodAutoscalers for the stateless services (autoscaling/v2).
# CPU-utilization based, min 2 replicas for HA. ai-matching-worker (Celery)
# is deliberately not on CPU HPA — scale it on queue depth with KEDA if
# needed; postgres/redis/rabbitmq/minio stay single-replica.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: gateway
    labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: strafor
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: gateway
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
              name: cpu
              target: { type: Utilization, averageUtilization: 70 }
