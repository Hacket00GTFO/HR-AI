# PodDisruptionBudgets — every workload gets one.
# HPA-managed services run >= 2 replicas so minAvailable: 1 still allows
# voluntary disruption. Single-replica workloads (db, redis, rabbitmq,
# minio, ai-matching-worker) also get minAvailable: 1 — it turns
# `kubectl drain` into a deliberate, operator-confirmed action rather than
# a silent outage. If that ever wedges a node upgrade, approve the eviction
# manually (kubectl drain --disable-eviction=false still respects PDBs).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: gateway
    labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: strafor }
spec:
    minAvailable: 1
    selector:
        matchLabels: { app.kubernetes.io/name: gateway }
