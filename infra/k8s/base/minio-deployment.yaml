# MinIO — S3-compatible object store for resumes/documents.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: strafor-minio
    namespace: strafor
    labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: minio
    template:
        metadata:
            labels:
                app.kubernetes.io/name: minio
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: minio
                  image: minio/minio:latest
                  args: ['server', '/data', '--console-address', ':9001']
                  ports:
                      - { name: s3, containerPort: 9000 }
                      - { name: console, containerPort: 9001 }
                  env:
                      - name: MINIO_ROOT_USER
                        valueFrom:
                            secretKeyRef: { name: strafor-secrets, key: MINIO_ROOT_USER }
                      - name: MINIO_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef: { name: strafor-secrets, key: MINIO_ROOT_PASSWORD }
                  readinessProbe:
                      httpGet: { path: /minio/health/ready, port: s3 }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /minio/health/live, port: s3 }
                      initialDelaySeconds: 30
                      periodSeconds: 30
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
                  volumeMounts:
                      - { name: data, mountPath: /data }
            volumes:
                # Document blobs must survive pod restarts — a real PVC.
                - name: data
                  persistentVolumeClaim:
                      claimName: strafor-minio-data
---
apiVersion: v1
kind: Service
metadata:
    name: strafor-minio
    namespace: strafor
    labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: minio
    ports:
        - { name: s3, port: 9000, targetPort: s3 }
        - { name: console, port: 9001, targetPort: console }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: strafor-minio-data
    namespace: strafor
    labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: strafor
spec:
    accessModes: ['ReadWriteOnce']
    resources:
        requests:
            storage: 10Gi
