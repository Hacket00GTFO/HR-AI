# Secret TEMPLATE — values are intentionally EMPTY.
# Materialize with envsubst before applying (see infra/k8s/README.md):
#   envsubst < infra/k8s/base/secrets.yaml | kubectl apply -f -
# For real clusters, prefer External Secrets / sealed-secrets over this file.
apiVersion: v1
kind: Secret
metadata:
    name: strafor-secrets
    namespace: strafor
    labels:
        app.kubernetes.io/part-of: strafor
type: Opaque
stringData:
    # Platform
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
    MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
    MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

    # Auth (legacy HS256 fallback + RS256 keypair for identity-auth)
    JWT_SECRET: "${JWT_SECRET}"
    JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
    JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY}"
    SERVICE_AUTH_TOKEN: "${SERVICE_AUTH_TOKEN}"

    # Outbound integrations
    SMTP_USER: "${SMTP_USER}"
    SMTP_PASS: "${SMTP_PASS}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
