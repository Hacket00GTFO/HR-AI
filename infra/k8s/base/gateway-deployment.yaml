# gateway — API gateway: JWT/JWKS enforcement, rate limit, correlation-id,
# upstream routing. The only service exposed directly (LoadBalancer) besides
# the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: gateway
    namespace: strafor
    labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: gateway
    template:
        metadata:
            labels:
                app.kubernetes.io/name: gateway
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: gateway
                  image: strafor/gateway:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 8080 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '8080'
                  readinessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: gateway
    namespace: strafor
    labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: strafor
spec:
    type: LoadBalancer
    selector:
        app.kubernetes.io/name: gateway
    ports:
        - { name: http, port: 8080, targetPort: http }
