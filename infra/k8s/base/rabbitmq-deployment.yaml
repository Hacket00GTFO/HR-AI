# RabbitMQ — domain events (topic exchange `domain.events`, quorum queues).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: strafor-rabbitmq
    namespace: strafor
    labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: rabbitmq
    template:
        metadata:
            labels:
                app.kubernetes.io/name: rabbitmq
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: rabbitmq
                  image: rabbitmq:3-management-alpine
                  ports:
                      - { name: amqp, containerPort: 5672 }
                      - { name: mgmt, containerPort: 15672 }
                  env:
                      - name: RABBITMQ_DEFAULT_USER
                        valueFrom:
                            configMapKeyRef: { name: strafor-config, key: RABBITMQ_USER }
                      - name: RABBITMQ_DEFAULT_PASS
                        valueFrom:
                            secretKeyRef: { name: strafor-secrets, key: RABBITMQ_PASSWORD }
                  readinessProbe:
                      exec: { command: ['rabbitmq-diagnostics', '-q', 'ping'] }
                      initialDelaySeconds: 15
                      periodSeconds: 10
                  livenessProbe:
                      exec: { command: ['rabbitmq-diagnostics', '-q', 'ping'] }
                      initialDelaySeconds: 60
                      periodSeconds: 30
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { memory: 768Mi }
                  volumeMounts:
                      - { name: data, mountPath: /var/lib/rabbitmq }
            volumes:
                - name: data
                  emptyDir: {} # dev-grade; quorum data should live on a PVC
---
apiVersion: v1
kind: Service
metadata:
    name: strafor-rabbitmq
    namespace: strafor
    labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: rabbitmq
    ports:
        - { name: amqp, port: 5672, targetPort: amqp }
        - { name: mgmt, port: 15672, targetPort: mgmt }
