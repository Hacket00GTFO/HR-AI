# notifications — templated email service (SMTP) + domain-event consumer.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: notifications
    namespace: strafor
    labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: notifications
    template:
        metadata:
            labels:
                app.kubernetes.io/name: notifications
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: notifications
                  image: strafor/notifications:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3007 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '3007'
                      - name: DATABASE_URL
                        value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/strafor_notifications'
                      - name: RABBITMQ_URL
                        value: 'amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)'
                  readinessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 30
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: notifications
    namespace: strafor
    labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: notifications
    ports:
        - { name: http, port: 3007, targetPort: http }
