# identity-auth — RS256 JWT issuer, users/settings, JWKS endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: identity-auth
    namespace: strafor
    labels:
        app.kubernetes.io/name: identity-auth
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: identity-auth
    template:
        metadata:
            labels:
                app.kubernetes.io/name: identity-auth
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: identity-auth
                  image: strafor/identity-auth:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3001 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '3001'
                      - name: DATABASE_URL
                        value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/strafor_identity'
                      - name: RABBITMQ_URL
                        value: 'amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)'
                      - name: JWT_GENERATE_KEYS
                        value: 'false'
                  readinessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 30
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: identity-auth
    namespace: strafor
    labels:
        app.kubernetes.io/name: identity-auth
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: identity-auth
    ports:
        - { name: http, port: 3001, targetPort: http }
