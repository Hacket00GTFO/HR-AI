# mailpit — dev SMTP sink + web UI. Remove in prod overlays where a real
# SMTP/SendGrid endpoint is configured instead.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: strafor-mailpit
    namespace: strafor
    labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: mailpit
    template:
        metadata:
            labels:
                app.kubernetes.io/name: mailpit
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: mailpit
                  image: axllent/mailpit:latest
                  ports:
                      - { name: smtp, containerPort: 1025 }
                      - { name: ui, containerPort: 8025 }
                  resources:
                      requests: { cpu: 10m, memory: 32Mi }
                      limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: strafor-mailpit
    namespace: strafor
    labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: mailpit
    ports:
        - { name: smtp, port: 1025, targetPort: smtp }
        - { name: ui, port: 8025, targetPort: ui }
