# api — legacy monolith (dashboard + settings + admin after the
# recruitment-core extraction; see docs/extraction/recruitment-core.md).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: strafor
    labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: api
    template:
        metadata:
            labels:
                app.kubernetes.io/name: api
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: api
                  image: strafor/api:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3000 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '3000'
                      - name: DATABASE_URL
                        value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/innovation'
                      - name: RESUMES_DIR
                        value: /app/secure_uploads/resumes
                  readinessProbe:
                      httpGet: { path: /api/health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /api/health, port: http }
                      initialDelaySeconds: 30
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { memory: 768Mi }
                  volumeMounts:
                      - { name: resumes, mountPath: /app/secure_uploads/resumes }
            volumes:
                - name: resumes
                  persistentVolumeClaim:
                      claimName: strafor-resumes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: strafor-resumes
    namespace: strafor
    labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: strafor
spec:
    accessModes: ['ReadWriteOnce']
    resources:
        requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
    name: api
    namespace: strafor
    labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: api
    ports:
        - { name: http, port: 3000, targetPort: http }
