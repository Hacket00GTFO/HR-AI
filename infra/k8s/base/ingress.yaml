# Ingress — public entrypoint. Frontend on /, API through the gateway.
# Requires an ingress controller (nginx). Annotate for TLS/cert-manager in
# overlays — the base stays controller-agnostic.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: strafor
    namespace: strafor
    labels:
        app.kubernetes.io/part-of: strafor
    annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: '10m' # resume uploads
        nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
spec:
    ingressClassName: nginx
    rules:
        - host: strafor.local
          http:
              paths:
                  - path: /api
                    pathType: Prefix
                    backend:
                        service:
                            name: gateway
                            port: { number: 8080 }
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: web
                            port: { number: 3010 }
