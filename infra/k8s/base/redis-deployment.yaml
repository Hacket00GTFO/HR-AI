# Redis — cache, rate limit, token blacklist (jti), Celery result backend.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: strafor-redis
    namespace: strafor
    labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: redis
    template:
        metadata:
            labels:
                app.kubernetes.io/name: redis
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: redis
                  image: redis:7-alpine
                  args: ['redis-server', '--appendonly', 'yes']
                  ports:
                      - { name: redis, containerPort: 6379 }
                  readinessProbe:
                      exec: { command: ['redis-cli', 'ping'] }
                      initialDelaySeconds: 3
                      periodSeconds: 10
                  livenessProbe:
                      exec: { command: ['redis-cli', 'ping'] }
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 25m, memory: 64Mi }
                      limits: { memory: 256Mi }
                  volumeMounts:
                      - { name: data, mountPath: /data }
            volumes:
                - name: data
                  emptyDir: {} # dev-grade persistence; use a PVC in real clusters
---
apiVersion: v1
kind: Service
metadata:
    name: strafor-redis
    namespace: strafor
    labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: redis
    ports:
        - { name: redis, port: 6379, targetPort: redis }
