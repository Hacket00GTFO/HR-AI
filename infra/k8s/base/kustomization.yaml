apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: strafor

resources:
    - namespace.yaml
    - configmap.yaml
    # secrets.yaml is a TEMPLATE — materialize with envsubst and apply
    # separately (see infra/k8s/README.md), or manage via External Secrets.
    - db-statefulset.yaml
    - redis-deployment.yaml
    - rabbitmq-deployment.yaml
    - minio-deployment.yaml
    - mailpit-deployment.yaml
    - api-deployment.yaml
    - identity-deployment.yaml
    - gateway-deployment.yaml
    - documents-deployment.yaml
    - notifications-deployment.yaml
    - ai-matching-deployment.yaml
    - analytics-deployment.yaml
    - web-deployment.yaml
    - ingress.yaml

labels:
    - pairs:
          app.kubernetes.io/part-of: strafor
      includeSelectors: true
