# documents-resumes — S3 document storage + text extraction.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: documents-resumes
    namespace: strafor
    labels:
        app.kubernetes.io/name: documents-resumes
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: documents-resumes
    template:
        metadata:
            labels:
                app.kubernetes.io/name: documents-resumes
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: documents-resumes
                  image: strafor/documents-resumes:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3004 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '3004'
                      - name: DATABASE_URL
                        value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/strafor_documents'
                      - name: RABBITMQ_URL
                        value: 'amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)'
                      - name: MINIO_ACCESS_KEY
                        value: '$(MINIO_ROOT_USER)'
                      - name: MINIO_SECRET_KEY
                        value: '$(MINIO_ROOT_PASSWORD)'
                      - name: MINIO_AUTOCREATE
                        value: 'true'
                      - name: MINIO_PUBLIC_ENDPOINT
                        value: ''
                  readinessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 30
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: documents-resumes
    namespace: strafor
    labels:
        app.kubernetes.io/name: documents-resumes
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: documents-resumes
    ports:
        - { name: http, port: 3004, targetPort: http }
