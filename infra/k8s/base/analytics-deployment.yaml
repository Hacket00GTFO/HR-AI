# analytics — event-fed read models + ATS metrics (skeleton).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: analytics
    namespace: strafor
    labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: analytics
    template:
        metadata:
            labels:
                app.kubernetes.io/name: analytics
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: analytics
                  image: strafor/analytics:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3008 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                      - secretRef: { name: strafor-secrets }
                  env:
                      - name: PORT
                        value: '3008'
                      - name: DATABASE_URL
                        value: 'postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/strafor_analytics'
                      - name: RABBITMQ_URL
                        value: 'amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)'
                  readinessProbe:
                      httpGet: { path: /ready, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: analytics
    namespace: strafor
    labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: analytics
    ports:
        - { name: http, port: 3008, targetPort: http }
