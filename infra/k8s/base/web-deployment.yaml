# web — Next.js 15 frontend + BFF (no database).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    namespace: strafor
    labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: strafor
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: web
    template:
        metadata:
            labels:
                app.kubernetes.io/name: web
                app.kubernetes.io/part-of: strafor
        spec:
            containers:
                - name: web
                  image: strafor/web:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - { name: http, containerPort: 3010 }
                  envFrom:
                      - configMapRef: { name: strafor-config }
                  env:
                      - name: PORT
                        value: '3010'
                  readinessProbe:
                      httpGet: { path: /api/health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /api/health, port: http }
                      initialDelaySeconds: 15
                      periodSeconds: 20
                  resources:
                      requests: { cpu: 50m, memory: 128Mi }
                      limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: web
    namespace: strafor
    labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: strafor
spec:
    selector:
        app.kubernetes.io/name: web
    ports:
        - { name: http, port: 3010, targetPort: http }
