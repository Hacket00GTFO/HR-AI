openapi: 3.1.0
info:
    title: StraforAI identity-auth service
    version: '1.0.0'
    description: |
        Contract for `apps/identity-auth` — the extracted identity and
        authentication service. Owns users, per-user settings and global
        integration secrets (AES-256-GCM at rest), and issues RS256 access
        tokens (15m) + rotating opaque refresh tokens (7d, reuse detection).

        Public key material is served at `/.well-known/jwks.json`; the
        gateway and other services verify access tokens against it and check
        the Redis `bl:<jti>` blacklist for revocation.

        Error envelope: `{ "error": string, "details"?: any }`.
servers:
    - url: http://localhost:3001
      description: Local development
    - url: http://identity-auth:3001
      description: docker-compose network
tags:
    - name: infra
    - name: auth
    - name: users
    - name: settings

paths:
    /health:
        get:
            tags: [infra]
            summary: Liveness probe — always 200 while the process runs
            security: []
            responses:
                '200': { $ref: '#/components/responses/HealthOk' }
    /ready:
        get:
            tags: [infra]
            summary: Readiness probe — reports db + redis status
            security: []
            responses:
                '200': { $ref: '#/components/responses/ReadyOk' }
                '503': { $ref: '#/components/responses/ReadyDegraded' }
    /.well-known/jwks.json:
        get:
            tags: [infra]
            summary: Public JWKS — RS256 verification keys for all services
            security: []
            responses:
                '200':
                    description: JWKS document (public keys only)
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Jwks' }

    /v1/auth/login:
        post:
            tags: [auth]
            summary: Log in — issues access + refresh tokens
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/LoginBody' }
            responses:
                '200':
                    description: Token pair + public user profile
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AuthResponse' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '429': { $ref: '#/components/responses/RateLimited' }
    /v1/auth/refresh:
        post:
            tags: [auth]
            summary: Rotate a refresh token — returns a fresh token pair
            description: |
                The presented refresh token is revoked and replaced
                (`replaced_by` chain, same `family_id`). Presenting an
                already-revoked token is treated as theft: the ENTIRE family
                is revoked and the call returns 401.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RefreshBody' }
            responses:
                '200':
                    description: Rotated token pair
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AuthResponse' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
    /v1/auth/logout:
        post:
            tags: [auth]
            summary: Log out — blacklists the access-token jti, revokes refresh family
            description: |
                Blacklists `bl:<jti>` in Redis for the token's remaining
                lifetime. When a `refreshToken` is supplied, only its family
                is revoked; otherwise every live refresh token of the user is.
            requestBody:
                required: false
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/LogoutBody' }
            responses:
                '200':
                    description: Logged out
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, status]
                                properties:
                                    message: { type: string, example: 'Logged out successfully' }
                                    status: { type: string, example: logged_out }
                '401': { $ref: '#/components/responses/Unauthorized' }
    /v1/auth/register:
        post:
            tags: [auth]
            summary: Register a new admin/hr account (admin only)
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RegisterBody' }
            responses:
                '201':
                    description: Created — token pair + public user profile
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AuthResponse' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
    /v1/auth/introspect:
        get:
            tags: [auth]
            summary: Introspect an access token (Authorization header or ?token=)
            description: |
                Service-to-service helper — reports whether a token is
                signature-valid AND not revoked (`bl:<jti>` checked).
            parameters:
                - name: token
                  in: query
                  required: false
                  schema: { type: string }
            responses:
                '200':
                    description: Introspection result
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Introspection' }
                '400': { $ref: '#/components/responses/ValidationError' }
    /v1/auth/password/forgot:
        post:
            tags: [auth]
            summary: Request a password-reset link (always 200 — no account disclosure)
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ForgotBody' }
            responses:
                '200':
                    description: Always the same generic message
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message]
                                properties:
                                    message: { type: string }
                '429': { $ref: '#/components/responses/RateLimited' }
    /v1/auth/password/reset:
        post:
            tags: [auth]
            summary: Reset password with a mailed token (single-use, 1h TTL)
            description: Consumes the token and revokes all refresh tokens of the user.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ResetBody' }
            responses:
                '200':
                    description: Password updated
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message]
                                properties:
                                    message: { type: string, example: 'Password reset successfully' }
                '400': { $ref: '#/components/responses/ValidationError' }
    /v1/auth/password/change:
        post:
            tags: [auth]
            summary: Change password (requires current password; revokes all sessions)
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ChangePasswordBody' }
            responses:
                '200':
                    description: Password changed
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message]
                                properties:
                                    message: { type: string, example: 'Password changed successfully' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /v1/users:
        get:
            tags: [users]
            summary: List users (admin only, paginated)
            parameters:
                - name: page
                  in: query
                  schema: { type: integer, minimum: 1, default: 1 }
                - name: limit
                  in: query
                  schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
                - name: role
                  in: query
                  schema: { type: string, enum: [admin, hr] }
                - name: q
                  in: query
                  description: Case-insensitive search over name + email
                  schema: { type: string, maxLength: 200 }
            responses:
                '200':
                    description: Page of public users
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserPage' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
        post:
            tags: [users]
            summary: Create a user (admin only)
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RegisterBody' }
            responses:
                '201':
                    description: Created user (no credentials in response)
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/PublicUser' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
    /v1/users/{id}:
        get:
            tags: [users]
            summary: Get a user (admin, or self)
            parameters:
                - $ref: '#/components/parameters/IdParam'
            responses:
                '200':
                    description: Public user profile
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/PublicUser' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [users]
            summary: 'Update a user (admin: all fields; self: firstName/lastName/location only)'
            parameters:
                - $ref: '#/components/parameters/IdParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/UserUpdateBody' }
            responses:
                '200':
                    description: Updated public user profile
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/PublicUser' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        delete:
            tags: [users]
            summary: Soft-delete a user (admin only; refuses last admin / self-delete)
            parameters:
                - $ref: '#/components/parameters/IdParam'
            responses:
                '200':
                    description: Deleted
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message]
                                properties:
                                    message: { type: string, example: 'User deleted successfully' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /v1/settings:
        get:
            tags: [settings]
            summary: Get the caller's settings row
            responses:
                '200':
                    description: Settings row
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Settings' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [settings]
            summary: Upsert the caller's settings (company/theme/notifications)
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/UserSettingsBody' }
            responses:
                '200':
                    description: Upserted settings row
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Settings' }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
    /v1/settings/integrations:
        get:
            tags: [settings]
            summary: Global integration config (admin only) — secrets decrypted for display
            responses:
                '200':
                    description: Integration config
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Integrations' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
        put:
            tags: [settings]
            summary: Update global integration config (admin only) — secrets encrypted at rest
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/IntegrationsBody' }
            responses:
                '200':
                    description: Updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    changedKeys: { type: array, items: { type: string } }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '503':
                    description: SETTINGS_ENCRYPTION_KEY not configured — secrets cannot be stored
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: RS256 access token (15m TTL) issued by /v1/auth/login.
    parameters:
        IdParam:
            name: id
            in: path
            required: true
            schema: { type: integer, minimum: 1 }
    schemas:
        Error:
            type: object
            required: [error]
            properties:
                error: { type: string }
                details: {}
        Jwks:
            type: object
            required: [keys]
            properties:
                keys:
                    type: array
                    items:
                        type: object
                        required: [kty, kid, alg, use, n, e]
                        properties:
                            kty: { type: string, example: RSA }
                            kid: { type: string }
                            alg: { type: string, example: RS256 }
                            use: { type: string, example: sig }
                            n: { type: string }
                            e: { type: string, example: AQAB }
        Location:
            type: object
            properties:
                country: { type: string, maxLength: 100 }
                city: { type: string, maxLength: 100 }
            additionalProperties: false
        PublicUser:
            type: object
            properties:
                id: { type: integer }
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [admin, hr] }
                location: { $ref: '#/components/schemas/Location' }
                lastLogin: { type: string, format: date-time, nullable: true }
                loggedOut: { type: boolean }
                active: { type: boolean }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        AuthResponse:
            type: object
            required: [accessToken, refreshToken, tokenType, expiresIn, user]
            properties:
                accessToken:
                    type: string
                    description: RS256 JWT — {sub,email,role,location,jti,iss}, 15m TTL
                refreshToken:
                    type: string
                    description: Opaque token (sha256-stored), rotates on every use
                tokenType: { type: string, example: Bearer }
                expiresIn: { type: integer, description: access-token TTL in seconds }
                user: { $ref: '#/components/schemas/PublicUser' }
                message: { type: string }
        UserPage:
            type: object
            required: [data, pagination]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicUser' }
                pagination:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                        page: { type: integer }
                        limit: { type: integer }
                        total: { type: integer }
                        totalPages: { type: integer }
        Introspection:
            type: object
            required: [active]
            properties:
                active: { type: boolean }
                sub: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, hr] }
                location: { $ref: '#/components/schemas/Location' }
                jti: { type: string }
                expiresAt: { type: string, format: date-time }
        LoginBody:
            type: object
            required: [email, password]
            properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 1, maxLength: 200 }
            additionalProperties: false
        RegisterBody:
            type: object
            required: [firstName, lastName, email, password, role]
            properties:
                firstName: { type: string, minLength: 1, maxLength: 100 }
                lastName: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password:
                    type: string
                    minLength: 8
                    maxLength: 200
                    description: Min 8 chars, at least 3 of lower/upper/digit/symbol
                role: { type: string, enum: [admin, hr] }
                location:
                    allOf:
                        - $ref: '#/components/schemas/Location'
                    description: Required (country+city) when role=hr
            additionalProperties: false
        RefreshBody:
            type: object
            required: [refreshToken]
            properties:
                refreshToken: { type: string, minLength: 1, maxLength: 500 }
            additionalProperties: false
        LogoutBody:
            type: object
            properties:
                refreshToken:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: Supplied → only that family revoked; omitted → all sessions revoked
            additionalProperties: false
        ForgotBody:
            type: object
            required: [email]
            properties:
                email: { type: string, format: email, maxLength: 255 }
            additionalProperties: false
        ResetBody:
            type: object
            required: [token, newPassword]
            properties:
                token: { type: string, minLength: 1, maxLength: 500 }
                newPassword: { type: string, minLength: 8, maxLength: 200 }
            additionalProperties: false
        ChangePasswordBody:
            type: object
            required: [currentPassword, newPassword]
            properties:
                currentPassword: { type: string, minLength: 1, maxLength: 200 }
                newPassword: { type: string, minLength: 8, maxLength: 200 }
            additionalProperties: false
        UserUpdateBody:
            type: object
            properties:
                firstName: { type: string, minLength: 1, maxLength: 100 }
                lastName: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8, maxLength: 200 }
                role: { type: string, enum: [admin, hr] }
                location: { $ref: '#/components/schemas/Location' }
                active: { type: boolean }
            additionalProperties: false
        Settings:
            type: object
            properties:
                id: { type: integer }
                user_id: { type: integer, nullable: true }
                company:
                    type: object
                    nullable: true
                    properties:
                        name: { type: string }
                        industry: { type: string }
                        size: {}
                        location: {}
                theme: { type: string, nullable: true }
                notifications: { type: boolean, nullable: true }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
        UserSettingsBody:
            type: object
            properties:
                company:
                    type: object
                    properties:
                        name: { type: string, maxLength: 255 }
                        industry: { type: string, maxLength: 255 }
                        size: {}
                        location: {}
                theme: { type: string, maxLength: 50 }
                notifications: { type: boolean }
        Integrations:
            type: object
            properties:
                linkedin:
                    type: object
                    nullable: true
                    properties:
                        clientId: { type: string }
                        clientSecret: { type: string, description: decrypted for admins only }
                        redirectUri: { type: string }
                occ:
                    type: object
                    nullable: true
                    properties:
                        apiKey: { type: string, description: decrypted for admins only }
                        apiSecret: { type: string, description: decrypted for admins only }
                        environment: { type: string }
                theme: { type: string }
                notifications: { type: boolean }
        IntegrationsBody:
            type: object
            properties:
                linkedin:
                    type: object
                    required: [clientId, clientSecret, redirectUri]
                    properties:
                        clientId: { type: string, minLength: 1, maxLength: 500 }
                        clientSecret: { type: string, minLength: 1, maxLength: 500 }
                        redirectUri: { type: string, minLength: 1, maxLength: 1000 }
                    additionalProperties: false
                occ:
                    type: object
                    required: [apiKey, apiSecret]
                    properties:
                        apiKey: { type: string, minLength: 1, maxLength: 500 }
                        apiSecret: { type: string, minLength: 1, maxLength: 500 }
                        environment: { type: string, maxLength: 50 }
                    additionalProperties: false
                theme: { type: string, maxLength: 50 }
                notifications: { type: boolean }
    responses:
        HealthOk:
            description: Service healthy
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            status: { type: string, example: ok }
                            service: { type: string, example: identity-auth }
                            timestamp: { type: string, format: date-time }
        ReadyOk:
            description: All dependencies reachable
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            status: { type: string, example: ready }
                            checks:
                                type: object
                                properties:
                                    db: { type: string, example: up }
                                    redis: { type: string, example: up }
        ReadyDegraded:
            description: A dependency is unreachable
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            status: { type: string, example: degraded }
                            checks: { type: object }
        ValidationError:
            description: Request failed Zod validation — details lists per-field issues
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Error' }
        Unauthorized:
            description: Missing/invalid/revoked token or credentials
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Error' }
        Forbidden:
            description: Authenticated but insufficient role, or account deactivated
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Error' }
        NotFound:
            description: Resource not found
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Error' }
        RateLimited:
            description: 'Rate limit exceeded (login/forgot: 20/15min; /v1: 600/15min)'
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Error' }

security:
    - bearerAuth: []
